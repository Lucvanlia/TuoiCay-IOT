; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/LiquidCrystal@^1.0.7
  beegee-tokyo/DHT sensor library for ESPx@^1.19

; Wokwi only: shortened timing and simulated calibration.
[env:esp32doit-devkit-v1]
build_flags = -D IRRIGATION_SIMULATION=1

; Real DOIT DevKit V1: calibration required, conservative timing.
[env:hardware]
build_flags = -D IRRIGATION_SIMULATION=0

; Use only for an actual NodeMCU-32S board.
[env:hardware-nodemcu32s]
board = nodemcu-32s
build_flags = -D IRRIGATION_SIMULATION=0
