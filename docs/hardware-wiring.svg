<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1300" viewBox="0 0 1720 1300">
<title>Sơ đồ đấu thật ESP32 tưới cây 12V</title><desc>Mạch nguồn, transistor kích relay, chuyển mức LCD và đầu vào. Công suất phụ thuộc thông số motor thực tế. Đọc PHAN_CUNG_THUC_TE.md trước khi lắp.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d;font-size:18px}.title{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.small{font-size:16px}.wire{fill:none;stroke:#266c81;stroke-width:3;stroke-linejoin:round}.power{fill:none;stroke:#bc3c45;stroke-width:3}.part{fill:white;stroke:#52687c;stroke-width:2}.panel{fill:#f8fafc;stroke:#ccd7e2;stroke-width:2}.note{fill:#925b11}</style></defs>
<rect width="1720" height="1300" fill="#eef3f8"/>
<text x="40" y="48" class="title">ESP32 • TƯỚI CÂY 12V — SƠ ĐỒ ĐẤU THẬT</text>
<text x="40" y="80">Thiết kế v1: motor giả định ≤1A chạy / ≤2A khởi động. Chưa nghiệm thu phần cứng. GPIO chỉ nhận 3,3V.</text><rect x="30" y="110" width="1660" height="205" rx="14" class="panel"/><text x="50" y="144" class="h">1. NGUỒN • 12V / 5V / 3V3</text><rect x="55" y="175" width="210" height="60" rx="8" class="part"/><text x="67" y="205">Adapter 12V / 5A</text><rect x="320" y="175" width="180" height="60" rx="8" class="part"/><text x="332" y="205">F0 T3,15A + SW0</text><polyline points="265,205 320,205" class="power"/><polyline points="500,205 590,205 590,165 670,165" class="power"/><polyline points="590,205 590,255 670,255" class="power"/><rect x="670" y="140" width="240" height="50" rx="8" class="part"/><text x="682" y="170">F1 T2A + SW1 cắt bơm</text><rect x="670" y="230" width="240" height="50" rx="8" class="part"/><text x="682" y="260">F2 T1A → BUCK</text><polyline points="910,165 970,165" class="power"/><text x="985" y="171" class="">→ K1.COM → K1.NO → PUMP+; PUMP− → STAR_GND</text><polyline points="910,255 970,255" class="power"/><text x="985" y="260" class="">5,0V → ESP32 5V / relay / LCD; 3V3 từ ESP32</text><text x="55" y="280" class="small">BUS_12V → mạch mưa 12V; C5 470µF/25V giữa BUS_12V và GND.</text><rect x="30" y="340" width="810" height="365" rx="14" class="panel"/><text x="50" y="374" class="h">2. DRIVER RELAY ACTIVE-LOW</text><text x="55" y="443" class="">GPIO26</text><rect x="165" y="415" width="135" height="46" rx="8" class="part"/><text x="177" y="445">R1 2,2k</text><polyline points="130,440 165,440" class="wire"/><polyline points="300,440 405,440" class="wire"/><rect x="405" y="407" width="180" height="115" rx="8" class="part"/><text x="417" y="437">Q1 P2N2222A</text><text x="416" y="461" class="">B</text><text x="550" y="439" class="">C</text><text x="550" y="502" class="">E</text><polyline points="350,440 350,545 400,545" class="wire"/><rect x="400" y="522" width="140" height="46" rx="8" class="part"/><text x="412" y="552">R2 10k</text><polyline points="540,545 610,545 610,610 760,610" class="wire"/><polyline points="585,494 610,494 610,545" class="wire"/><text x="685" y="635" class="">GND logic</text><polyline points="585,430 650,430 650,520 745,520" class="wire"/><text x="678" y="505" class="">K1.IN</text><rect x="610" y="368" width="115" height="40" rx="8" class="part"/><text x="622" y="398">R3 4,7k</text><polyline points="650,408 650,430" class="wire"/><text x="736" y="392" class="">5V</text><polyline points="725,388 780,388" class="power"/><text x="55" y="585" class="small">K1.VCC = 5V; K1.GND = GND; K1 phải có diode cuộn dây.</text><text x="55" y="655" class="small">GPIO HIGH → Q1 ON → IN LOW → bơm ON. LOW/Hi-Z → OFF.</text><text x="55" y="682" class="small">Xác minh pin B/C/E theo đúng package; đo dòng IN trước lắp.</text><rect x="870" y="340" width="820" height="365" rx="14" class="panel"/><text x="890" y="374" class="h">3. LCD 5V • CHUYỂN MỨC I2C HAI CHIỀU</text><text x="895" y="440" class="">GPIO21</text><polyline points="980,434 1100,434" class="wire"/><rect x="1100" y="405" width="235" height="60" rx="8" class="part"/><text x="1112" y="435">Q2 BSS138: S → D</text><polyline points="1335,434 1480,434" class="wire"/><text x="1500" y="440" class="">LCD.SDA</text><polyline points="1040,434 1040,412" class="wire"/><text x="930" y="400" class="small">4,7k → 3V3</text><polyline points="1390,434 1390,412" class="wire"/><text x="1370" y="400" class="small">4,7k → 5V</text><text x="1125" y="488" class="small">GATE → 3V3</text><text x="895" y="585" class="">GPIO22</text><polyline points="980,579 1100,579" class="wire"/><rect x="1100" y="550" width="235" height="60" rx="8" class="part"/><text x="1112" y="580">Q3 BSS138: S → D</text><polyline points="1335,579 1480,579" class="wire"/><text x="1500" y="585" class="">LCD.SCL</text><polyline points="1040,579 1040,519" class="wire"/><text x="930" y="507" class="small">4,7k → 3V3</text><polyline points="1390,579 1390,519" class="wire"/><text x="1370" y="507" class="small">4,7k → 5V</text><text x="1125" y="633" class="small">GATE → 3V3</text><text x="895" y="673" class="small">LCD.VCC = 5V, GND chung; đếm cả pull-up có sẵn trên module.</text><rect x="30" y="730" width="810" height="445" rx="14" class="panel"/><text x="50" y="764" class="h">4. CẢM BIẾN / NÚT • INPUT CHỈ 3V3</text><text x="55" y="825" class="">AO đất</text><rect x="165" y="798" width="130" height="44" rx="8" class="part"/><text x="177" y="828">R10 1k</text><polyline points="125,820 165,820" class="wire"/><polyline points="295,820 700,820" class="wire"/><text x="705" y="825" class="">GPIO34</text><polyline points="350,820 350,880" class="wire"/><rect x="300" y="880" width="150" height="42" rx="8" class="part"/><text x="312" y="910">C1 100nF</text><polyline points="350,922 350,960 670,960" class="wire"/><polyline points="550,820 550,880" class="wire"/><rect x="480" y="880" width="145" height="42" rx="8" class="part"/><text x="492" y="910">R11 100k</text><polyline points="550,922 550,960" class="wire"/><text x="680" y="966" class="">GND</text><text x="55" y="998" class="small">Đất VCC=3V3, GND chung, C2 100nF sát sensor.</text><text x="55" y="1030" class="small">GPIO27 mưa | 33 phao | 32 STOP | 18 MODE | 19 WATER | 23 RESUME</text><text x="55" y="1060" class="small">Mỗi GPIO → 10k → 3V3. Tiếp điểm / nút nối GPIO về GND.</text><text x="55" y="1090" class="small">Phao: ĐỦ nước = đóng. Mưa: ƯỚT = đóng (chọn NO/NC theo đo).</text><text x="55" y="1120" class="small">GPIO25 → 330Ω → LED đỏ (A); LED (K) → GND.</text><text x="55" y="1150" class="small">Mạch mưa 12V chỉ đưa TIẾP ĐIỂM KHÔ về GPIO, không đưa DO12V.</text><rect x="870" y="730" width="820" height="445" rx="14" class="panel"/><text x="890" y="764" class="h">5. MOTOR / DIODE • TẢI NẰM SAU TIẾP ĐIỂM NO</text><text x="895" y="823" class="">Sau F1 / SW1</text><polyline points="1045,817 1100,817" class="wire"/><rect x="1100" y="788" width="160" height="50" rx="8" class="part"/><text x="1112" y="818">K1 COM / NO</text><polyline points="1260,817 1590,817" class="power"/><text x="1390" y="798" class="small">PUMP+</text><rect x="1460" y="890" width="185" height="75" rx="8" class="part"/><text x="1472" y="920">MOTOR 12V</text><polyline points="1550,817 1550,890" class="power"/><polyline points="1550,965 1550,1020 1090,1020" class="wire"/><text x="895" y="1026" class="">STAR_GND</text><polyline points="1340,817 1340,900" class="wire"/><rect x="1275" y="900" width="130" height="65" rx="8" class="part"/><text x="1287" y="930">D1 1N5408</text><polyline points="1340,965 1340,1020" class="wire"/><text x="1283" y="880" class="small">K: đầu có vạch</text><text x="1295" y="990" class="small">A → GND</text><text x="895" y="1068" class="small">D1 mắc SONG SONG motor: cathode lên PUMP+, anode về PUMP−.</text><text x="895" y="1100" class="small">C3 470µF/16V trên5V; C4/C6 100nF gần relay/LCD.</text><text x="895" y="1132" class="small">C7 100nF/50V tại motor chổi than nếu phù hợp. Không dùng PWM relay.</text><text x="40" y="1220" class="note">Cầu chì / relay / dây phải chốt theo dòng thực đo và đường cong bảo vệ; SW1 cắt bơm độc lập firmware.</text><text x="40" y="1252" class="small">Đọc PHAN_CUNG_THUC_TE.md để tính nguồn, kiểm tra USB backfeed, hiệu chuẩn, bố trí dây và nghiệm thu.</text></svg>
